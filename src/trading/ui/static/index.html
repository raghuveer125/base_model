<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading_Plug&amp;Play</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Trading_Plug&amp;Play</h1>
    <nav id="tabs" aria-label="Indices"></nav>
    <div id="status" aria-live="polite">
      <span>spot:</span>
      <span id="spot">—</span>
      <span class="sep">|</span>
      <span>last tick:</span>
      <span id="last-seen">—</span>
      <span class="sep">|</span>
      <span id="ws-status">disconnected</span>
    </div>
  </header>

  <main>
    <section id="chain-section">
      <div class="section-head">
        <h2>Option chain (live, with Greeks)</h2>
        <label>expiry
          <input id="expiry" type="date" />
        </label>
        <button id="load-chain">Load</button>
      </div>
      <table id="chain">
        <thead>
          <tr>
            <th colspan="6" class="side-ce">CALL</th>
            <th class="strike-head">STRIKE</th>
            <th colspan="6" class="side-pe">PUT</th>
          </tr>
          <tr>
            <th>LTP</th><th>&Delta;</th><th>&Gamma;</th><th>&Theta;</th><th>&nu;</th><th>IV</th>
            <th></th>
            <th>IV</th><th>&nu;</th><th>&Theta;</th><th>&Gamma;</th><th>&Delta;</th><th>LTP</th>
          </tr>
        </thead>
        <tbody id="chain-tbody"></tbody>
      </table>
    </section>

    <section id="candles-section">
      <h2>Candles (1m)</h2>
      <ul id="candles" class="feed"></ul>
    </section>

    <section id="signals-section">
      <h2>Signals</h2>
      <ul id="signals" class="feed"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
